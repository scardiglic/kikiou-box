<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, #1b2233 0%, #0a0d14 70%);
    color: #e6e6e6;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
    overflow: hidden; user-select: none;
  }

  h1 {
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    font-weight: 800; letter-spacing: -1px; text-align: center;
    background: linear-gradient(90deg,#ff9f43,#ff6b35,#ff4d6d);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 6px;
  }
  .sub {
    color: #6e7681; font-size: clamp(.78rem, 2.5vw, .92rem);
    text-align: center; margin-bottom: 28px;
  }

  .scene { position: relative; display: flex; align-items: center; justify-content: center; }

  .boite {
    width: clamp(170px, 44vw, 240px);
    height: clamp(170px, 44vw, 240px);
    position: relative; cursor: pointer;
    transition: transform .12s ease;
    filter: drop-shadow(0 18px 32px rgba(0,0,0,.6));
  }
  .boite:hover { transform: translateY(-6px) scale(1.03); }
  .boite:active { transform: translateY(2px) scale(.97); }
  .boite.secoue { animation: secousse .5s ease; }
  @keyframes secousse {
    0%,100% { transform: translateX(0) rotate(0); }
    15% { transform: translateX(-10px) rotate(-3deg); }
    30% { transform: translateX(9px) rotate(3deg); }
    45% { transform: translateX(-7px) rotate(-2deg); }
    60% { transform: translateX(6px) rotate(2deg); }
    80% { transform: translateX(-3px) rotate(-1deg); }
  }

  .couvercle {
    position: absolute; top: 0; left: 0; width: 100%;
    /* Charnière à gauche : le couvercle pivote depuis le bord gauche */
    transform-origin: 0% 100%;
    transition: transform .38s cubic-bezier(.3,-0.4,.4,1.6);
    z-index: 3;
  }
  .boite.ouverte .couvercle { transform: rotate(-112deg) translateY(-4%); }

  .chat {
    position: absolute; left: 50%; bottom: 34%;
    width: 54%; height: auto;
    transform: translate(-50%, 12%) scale(.2) rotate(-8deg);
    opacity: 0; pointer-events: none;
    transition: transform .5s cubic-bezier(.2,-0.3,.3,1.5), opacity .25s;
    z-index: 2;
  }
  .boite.ouverte .chat {
    opacity: 1;
    transform: translate(-50%, -110%) scale(1) rotate(0deg);
  }
  .boite.ouverte .chat.flotte {
    animation: flotte 2.4s ease-in-out infinite;
  }
  @keyframes flotte {
    0%,100% { transform: translate(-50%, -110%) scale(1) rotate(-2deg); }
    50%     { transform: translate(-50%, -120%) scale(1) rotate(2deg); }
  }

  .hint {
    margin-top: 34px; color: #484f58; font-size: .82rem; text-align: center;
    min-height: 1.2em; transition: color .3s; font-weight: 600;
  }
  .hint.actif { color: #ff9f43; }
  .hint.vide { visibility: hidden; }

  .compteur { margin-top: 18px; font-size: .78rem; color: #484f58; }
  .compteur b { color: #ff9f43; }

  .pub {
    position: fixed; left: 50%; transform: translateX(-50%);
    width: min(92vw, 728px); min-height: 90px;
    border: 1px dashed #21262d; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #30363d; font-size: .72rem; letter-spacing: 1px;
    text-transform: uppercase;
  }
  .pub.haut { top: 12px; }
  .pub.bas { bottom: 12px; }

  footer { position: fixed; bottom: 4px; right: 10px; font-size: .65rem; color: #21262d; }

  /* Navigation entre les pages — placee sous le compteur, dans le flux normal */
  .topnav { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
            padding: 0; margin-top: 34px; position: relative; z-index: 10; }
  .topnav a { color: #7d8590; text-decoration: none; font-size: .84rem;
              font-weight: 600; transition: .2s; }
  .topnav a:hover, .topnav a.actif { color: #ff9f43; }


  /* Bouton de partage (moteur de viralite) */
  .partage {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin: 14px auto 0;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
    max-width: 420px;
    padding: 0 16px;
  }
  .partage.visible { opacity: 1; transform: none; pointer-events: auto; }
  .partage button {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 16px;
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    color: #0a0d14;
    background: linear-gradient(180deg, #ffb066, #e8722a);
    box-shadow: 0 3px 0 #a8440f;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .partage button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #a8440f;
  }
  .partage button.alt {
    background: linear-gradient(180deg, #3a4152, #262c38);
    color: #e6e9ef;
    box-shadow: 0 3px 0 #14171e;
  }
  .partage button.alt:active { box-shadow: 0 1px 0 #14171e; }
  .partage .confirme {
    font-size: .82rem;
    color: #6ee7a8;
    text-align: center;
    width: 100%;
  }
  @media (max-width: 420px) {
    .partage { flex-direction: column; }
    .partage button { width: 100%; }
  }

  @media (max-height: 660px) { .pub { display: none; } }
</style>
</head>
<body>

<div class="scene">
  <div class="boite" id="boite" role="button" tabindex="0" aria-label="Ouvrir la boîte">

    <svg class="couvercle" viewBox="0 0 200 70" aria-hidden="true">
      <defs>

          <stop offset="100%" stop-color="#e8722a"/>
        </linearGradient>
      </defs>
      <rect x="0" y="18" width="200" height="52" rx="7" fill="url(#gc)"/>
      <rect x="0" y="18" width="200" height="10" rx="5" fill="#ffd0a3" opacity=".55"/>
      <rect x="88" y="18" width="24" height="52" fill="#c25a1c" opacity=".55"/>

    <svg class="chat" id="chat" viewBox="0 0 140 145" aria-hidden="true"></svg>

    <svg viewBox="0 0 200 190" aria-hidden="true"

      <defs>

      <rect x="6" y="62" width="188" height="122" rx="9" fill="url(#gb)"/>
      <rect x="6" y="62" width="188" height="14" rx="7" fill="#ffb066" opacity=".5"/>
      <rect x="86" y="62" width="28" height="122" fill="#8c3609" opacity=".45"/>
      <text x="100" y="128" text-anchor="middle" font-size="26" font-weight="bold"

            letter-spacing="-0.5">Kikiou-Box</text>
    </svg>
  </div>
</div>

<p class="hint" id="hint">Clique pour ouvrir</p>
<p class="compteur">Boîtes ouvertes : <b id="nb">0</b></p>

<div class="partage" id="partage">
  <button id="btn-partage" type="button">
    <span aria-hidden="true">📤</span> Partager Kikiou

  <span style="color:#21262d;margin:0 8px;">Kikiou-Box v3</span>

<script src="/assets/chats.js"></script>
<script>
// ============================================================
//  LE CHAT — un seul personnage, plusieurs expressions
//  Style kawaii japonais : tête ronde, oreilles triangulaires,
//  museau clair, joues roses, grands yeux, moustaches, queue.
// ============================================================
// Les personnages et la fonction de dessin sont dans assets/chats.js
// (fichier partage avec la page galerie chats.html)

const boite = document.getElementById('boite');
const chat  = document.getElementById('chat');
const hint  = document.getElementById('hint');
const nbEl  = document.getElementById('nb');

let ouverte = false;
let compteur = 0;
let derniere = -1;
let minuteurFermeture = null;

function tirer() {
  let i;
  do { i = Math.floor(Math.random() * EXPRESSIONS.length); }
  while (i === derniere && EXPRESSIONS.length > 1);
  derniere = i;
  return EXPRESSIONS[i];
}

function fermer() {
  boite.classList.remove('ouverte', 'flotte');
  ouverte = false;
  hint.textContent = "Clique pour rouvrir";
  hint.classList.remove('vide');
}

function ouvrir() {
  if (ouverte) {
    clearTimeout(minuteurFermeture);
    fermer();
    return;
  }

  const e = tirer();
  chat.innerHTML = dessinerChat(e);

  boite.classList.add('secoue');
  setTimeout(() => {
    boite.classList.remove('secoue');
    boite.classList.add('ouverte');
    setTimeout(() => boite.classList.add('flotte'), 520);
  }, 320);

  ouverte = true;
  compteur++;
  nbEl.textContent = compteur;
  hint.textContent = "";
  hint.classList.add('vide');
  afficherPartage(e);

  // Refermeture automatique 2 secondes apres l'ouverture
  clearTimeout(minuteurFermeture);
  minuteurFermeture = setTimeout(fermer, 2000 + 320);
}

boite.addEventListener('click', ouvrir);
boite.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ouvrir(); }
});


// ------------------------------------------------------------
//  Partage social — moteur de viralite
//  Le lien contient le chat obtenu : en ouvrant, le visiteur
//  decouvre le meme chat.
// ------------------------------------------------------------
const partageEl = document.getElementById('partage');
const btnPartage = document.getElementById('btn-partage');
const btnLien = document.getElementById('btn-lien');

let dernierChat = null;

function textePartage(e) {
  return "J'ai eu « " + e.nom + " » dans la Kikiou-Box ! 🎃 "
       + "Clique pour voir lequel tu obtiens :";
}

function lienAvecChat(e) {
  return "https://kikiou.com/?chat=" + encodeURIComponent(e.nom);
}

function afficherPartage(e) {
  dernierChat = e;
  partageEl.classList.add('visible');
}

if (btnPartage) {
  btnPartage.addEventListener('click', async () => {
    if (!dernierChat) return;
    const texte = textePartage(dernierChat);
    const url = lienAvecChat(dernierChat);

    // API native de partage (mobile) si disponible
    if (navigator.share) {
      try {
        await navigator.share({ title: "Kikiou-Box", text: texte, url: url });
        return;
      } catch (err) {
        // l'utilisateur a annule : on continue vers le repli
      }
    }
    // Repli : X / Twitter
    window.open("https://twitter.com/intent/tweet?text="
      + encodeURIComponent(texte) + "&url=" + encodeURIComponent(url),
      "_blank", "noopener");
  });
}

if (btnLien) {
  btnLien.addEventListener('click', async () => {
    if (!dernierChat) return;
    const url = lienAvecChat(dernierChat);
    try {
      await navigator.clipboard.writeText(url);
      const avant = btnLien.innerHTML;
      btnLien.innerHTML = "✅ Lien copié";
      setTimeout(() => { btnLien.innerHTML = avant; }, 1600);
    } catch (err) {
      // repli si le presse-papiers est bloque
      window.prompt("Copie ce lien :", url);
    }
  });
}


// ------------------------------------------------------------
//  Lien recu : ?chat=Nom  -> on ouvre directement ce chat
// ------------------------------------------------------------
(function ouvrirDepuisLien() {
  const params = new URLSearchParams(location.search);
  const nom = params.get('chat');
  if (!nom) return;
  const e = EXPRESSIONS.find(x => x.nom.toLowerCase() === nom.toLowerCase());
  if (!e) return;

  setTimeout(() => {
    chat.innerHTML = dessinerChat(e);
    boite.classList.add('ouverte', 'flotte');
    ouverte = true;
    compteur++;
    nbEl.textContent = compteur;
    hint.textContent = "";
    hint.classList.add('vide');
    afficherPartage(e);
  }, 600);
})();

chat.innerHTML = dessinerChat(EXPRESSIONS[0]);
</script>
</body>
