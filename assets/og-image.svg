<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Fond -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="boite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8722a"/>
      <stop offset="100%" stop-color="#a8440f"/>
    </linearGradient>
    <linearGradient id="couv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb066"/>
      <stop offset="100%" stop-color="#e8722a"/>
    </linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#e8722a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fond)"/>

  <!-- Etoiles / ambiance Halloween -->
  <g fill="#ffb066" opacity="0.35">
    <circle cx="120" cy="90" r="3"/>
    <circle cx="320" cy="60" r="2"/>
    <circle cx="520" cy="110" r="2.5"/>
    <circle cx="880" cy="70" r="3"/>
    <circle cx="1080" cy="130" r="2"/>
    <circle cx="200" cy="520" r="2"/>
    <circle cx="1020" cy="500" r="2.5"/>
    <circle cx="720" cy="560" r="2"/>
  </g>

  <!-- Titre -->
  <text x="600" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="76" font-weight="800" fill="#ffb066" letter-spacing="-2">Kikiou-Box</text>
  <text x="600" y="166" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="30" font-weight="500" fill="#8b95a5" letter-spacing="1">Édition Halloween 🎃</text>

  <!-- La boite avec le chat qui sort -->
  <g transform="translate(600, 400)">
    <!-- couvercle -->
    <rect x="-160" y="-88" width="320" height="46" rx="9" fill="url(#couv)"/>
    <rect x="-160" y="-88" width="320" height="12" rx="6" fill="#ffd0a3" opacity="0.55"/>

    <!-- chat (tete) -->
    <g transform="translate(0, -40)">
      <!-- oreilles -->
      <path d="M -68 -52 L -78 -96 L -36 -70 Z" fill="url(#robe)"/>
      <path d="M -68 -52 L -78 -96 L -36 -70 Z" fill="#ffb066" opacity="0.4"
            transform="translate(0,6) scale(0.72)"/>
      <path d="M 68 -52 L 78 -96 L 36 -70 Z" fill="url(#robe)"/>
      <path d="M 68 -52 L 78 -96 L 36 -70 Z" fill="#ffb066" opacity="0.4"
            transform="translate(0,6) scale(0.72)"/>
      <!-- tete -->
      <ellipse cx="0" cy="0" rx="86" ry="76" fill="url(#robe)"/>
      <!-- yeux -->
      <ellipse cx="-32" cy="-10" rx="11" ry="13" fill="#141a26"/>
      <ellipse cx="32" cy="-10" rx="11" ry="13" fill="#141a26"/>
      <circle cx="-28" cy="-15" r="4" fill="#ffffff" opacity="0.85"/>
      <circle cx="36" cy="-15" r="4" fill="#ffffff" opacity="0.85"/>
      <!-- joues -->
      <ellipse cx="-56" cy="14" rx="14" ry="9" fill="#ff6b9d" opacity="0.4"/>
      <ellipse cx="56" cy="14" rx="14" ry="9" fill="#ff6b9d" opacity="0.4"/>
      <!-- bouche -->
      <path d="M -16 24 Q 0 40 16 24" stroke="#141a26" stroke-width="5"
            fill="none" stroke-linecap="round"/>
      <!-- moustaches -->
      <g stroke="#141a26" stroke-width="3" opacity="0.5" stroke-linecap="round">
        <line x1="-92" y1="2" x2="-124" y2="-6"/>
        <line x1="-92" y1="16" x2="-124" y2="18"/>
        <line x1="92" y1="2" x2="124" y2="-6"/>
        <line x1="92" y1="16" x2="124" y2="18"/>
      </g>
      <!-- chapeau de sorciere -->
      <path d="M -70 -62 L 0 -150 L 70 -62 Z" fill="#6b4fa0"/>
      <rect x="-84" y="-70" width="168" height="16" rx="8" fill="#4a3570"/>
      <circle cx="0" cy="-150" r="9" fill="#ffb066"/>
    </g>

    <!-- corps de la boite -->
    <rect x="-176" y="-46" width="352" height="200" rx="14" fill="url(#boite)"/>
    <rect x="-176" y="-46" width="352" height="24" rx="12" fill="#ffb066" opacity="0.5"/>
    <rect x="-30" y="-46" width="60" height="200" fill="#8c3609" opacity="0.45"/>
    <text x="0" y="70" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="46" font-weight="bold" fill="#ffffff" opacity="0.9"
          letter-spacing="-1">Kikiou-Box</text>
  </g>

  <!-- Accroche -->
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="27" font-weight="500" fill="#c9d1d9">Clique sur la boîte. Découvre ton chat.</text>
</svg>
